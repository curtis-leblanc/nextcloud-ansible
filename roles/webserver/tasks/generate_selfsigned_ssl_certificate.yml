---
- name: Ensure private key directory exists
  file:
    path: /etc/ssl/private
    state: directory
    mode: 0700

- name: Generate a private key
  community.crypto.openssl_privatekey:
    path: "{{ ssl_key_path }}"
    size: 4096

- name: Ensure self signed certificate directory exists
  file:
    path: /etc/ssl/certs
    state: directory
    mode: 0755

- name: create self signed certificate
  community.crypto.x509_certificate:
    path: "{{ ssl_crt_path }}"
    privatekey_path: "{{ ssl_key_path }}"
    provider: selfsigned

- name: copy certificate to new ssl path (rocky9)
  ansible.builtin.copy:
    src: /etc/ssl/certs/nextcloud.crt
    dest: /etc/pki/tls/certs/localhost.crt
  when:
    - ansible_distribution == 'Rocky'
    - ansible_distribution_major_version == "9"

- name: copy key to new ssl path (rocky9)
  ansible.builtin.copy:
    src: /etc/ssl/certs/nextcloud.key
    dest: /etc/pki/tls/private/localhost.key
  when:
    - ansible_distribution == 'Rocky'
    - ansible_distribution_major_version == "9"





