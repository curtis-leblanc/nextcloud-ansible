---
- name: Ensure extraction tools are installed
  ansible.builtin.yum:
    name:
      - tar
      - unzip
      - gzip
      - bzip2
    state: present
  when: ansible_distribution == 'Rocky'

- name: install mariadb on rocky
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  with_items: "{{ rocky_mariadb_packages }}"
  when:
    - ansible_distribution == 'Rocky'
    - ansible_distribution_major_version == "8"


- name: install mariadb on rocky9
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  with_items: "{{ rocky9_mariadb_packages }}"
  when:
    - ansible_distribution == 'Rocky'
    - ansible_distribution_major_version == "9"

- name: install httpd packages on rocky
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  with_items: "{{ rocky_httpd_packages }}"
  when: ansible_distribution == 'Rocky'

- name: install PHP packages on rocky
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  with_items: "{{ rocky_php_packages }}"
  when: ansible_distribution == 'Rocky'

- name: install redis on rocky
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  with_items: "{{ rocky_redis_packages }}"
  when: ansible_distribution == 'Rocky'
