---
- name: add PHP repo gpg on rocky
  ansible.builtin.rpm_key:
    state: present
    key: https://rpms.remirepo.net/enterprise/8/RPM-GPG-KEY-remi
  when: 
    - ansible_distribution == 'Rocky'
    - ansible_distribution_major_version == "8"

- name: add PHP repo gpg on rocky9
  ansible.builtin.rpm_key:
    state: present
    key: https://rpms.remirepo.net/enterprise/9/RPM-GPG-KEY-remi
  when:
    - ansible_distribution == 'Rocky'
    - ansible_distribution_major_version == "9"

- name: add PHP repo on rocky
  ansible.builtin.dnf:
    name: 'https://rpms.remirepo.net/enterprise/remi-release-8.rpm'
    state: present
  when:
    - ansible_distribution == 'Rocky'
    - ansible_distribution_major_version == "8"

- name: add PHP repo on rocky9
  ansible.builtin.dnf:
    name: 'https://rpms.remirepo.net/enterprise/remi-release-9.rpm'
    state: present
  when:
    - ansible_distribution == 'Rocky'
    - ansible_distribution_major_version == "9"
